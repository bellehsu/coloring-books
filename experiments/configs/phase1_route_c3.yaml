# Phase 1 Route C 第三輪（C3，A 部分）：草圖只畫道具與背景、不畫角色（experiments/samples/pose/*_props.png）。
# C2 結論：火柴人角色草圖會把角色比例拉壞；ControlNet 0.7 會壓掉粗黑外框，讓擷取失敗。
# 本輪固定 scene 背景提示詞、IP-Adapter 0.55 / 0.6，比較：
#   none（ControlNet 0）vs props04（scribble 0.4，前 50%）vs props06（0.6，前 60%）
# 擷取：luma、xdog、hybrid（C3 新增，見 app.services.lineart_extract）。
# 含火柴人的完整草圖（0.5 / 0.5）與 C2 的 scene_cn05 參數、seed 完全相同，直接引用 C2 結果比較，不重跑。
# 3 姿勢 × 3 場景 × 3 seeds = 27 張生成；× 3 擷取 = 81 格。

name: phase1_route_c3

character:
  name: momo
  description: "a cute small bunny girl with long upright blue bunny ears, blue bob hair, big round eyes, blue and white striped overalls, blue shoes"
  reference_image: experiments/samples/character_ref.png

seeds: [101, 202, 303]

postprocess:
  target_width: 2480
  target_height: 3508
  line_width_px: 11
  min_fragment_area: 64
  close_kernel: 7

routes:
  C:
    workflow: route_a_sdxl_ipadapter_cn
    params:
      character_image: "{character_image}"
      prompt: "{character}, {scene}, {lineart}"
      ipadapter_weight: 0.55
      ipadapter_end_at: 0.6
      controlnet_type: "hed/pidi/scribble/ted"
      controlnet_strength: 0.0
      negative_prompt: "plain background, empty background, white background, photo, realistic, 3d render, gradient, soft shading, airbrush, texture, noise, blurry, sketch, monochrome, grayscale, text, watermark, signature"

lineart_methods:

  none_luma:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.0}
    extract: {method: luma, threshold: 90}

  none_xdog:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.0}
    extract: {method: xdog, sigma: 0.8, k: 1.6, p: 20.0, eps: 0.02, phi: 10.0}

  none_hybrid:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.0}
    extract: {method: hybrid}

  props04_luma:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.4, controlnet_end_percent: 0.5}
    extract: {method: luma, threshold: 90}

  props04_xdog:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.4, controlnet_end_percent: 0.5}
    extract: {method: xdog, sigma: 0.8, k: 1.6, p: 20.0, eps: 0.02, phi: 10.0}

  props04_hybrid:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.4, controlnet_end_percent: 0.5}
    extract: {method: hybrid}

  props06_luma:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.6, controlnet_end_percent: 0.6}
    extract: {method: luma, threshold: 90}

  props06_xdog:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.6, controlnet_end_percent: 0.6}
    extract: {method: xdog, sigma: 0.8, k: 1.6, p: 20.0, eps: 0.02, phi: 10.0}

  props06_hybrid:
    prompt: "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, full detailed background scene"
    params: {controlnet_strength: 0.6, controlnet_end_percent: 0.6}
    extract: {method: hybrid}

scenes:
  park:
    prompt: "sitting on a swing and holding the ropes, in a sunny park with trees"
    params: {structure_image: experiments/samples/pose/park_swing_props.png}
  kitchen:
    prompt: "holding a tray of freshly baked cookies next to the oven in a cozy kitchen"
    params: {structure_image: experiments/samples/pose/kitchen_baking_props.png}
  bedroom:
    prompt: "sitting in bed reading an open picture book at night, a small bedside lamp, moon and stars in the dark window"
    params: {structure_image: experiments/samples/pose/bedroom_reading_props.png}
