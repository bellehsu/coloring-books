# Phase 1 Route C 第一輪：先生成「彩色」角色圖，再擷取線稿。
# 生成沿用 route_a_sdxl_ipadapter_cn（SDXL + IP-Adapter，彩色參考圖），提示詞改成要彩色平塗插畫、粗黑外框；
# 負向提示詞覆寫掉 Route A 預設裡的 color / colored。
# C0（experiments/results/phase1_route_c0_reextract_*）：使用者判定 ip_weak-luma、ip_weak-xdog 最符合目標成品。
# 本輪以 ip_weak（0.55 / end_at 0.6）為中心，上下各取一檔，看一致性與場景變化的取捨；擷取只比 luma 與 xdog。
# 生成參數相同的格子只生成一次（同一 IP 檔位的 luma 與 xdog 共用同一張彩色圖）。
# 新增 bedroom 夜景：深色背景是 luma 的壓力測試。

name: phase1_route_c1

character:
  name: momo
  description: "a cute small bunny girl with long upright blue bunny ears, blue bob hair, big round eyes, blue and white striped overalls, blue shoes"
  reference_image: experiments/samples/character_ref.png

seeds: [101, 202, 303]

postprocess:
  target_width: 2480
  target_height: 3508
  line_width_px: 11
  min_fragment_area: 64
  close_kernel: 7

routes:
  C:
    workflow: route_a_sdxl_ipadapter_cn
    params:
      character_image: "{character_image}"
      prompt: "{character}, {scene}, {lineart}"
      negative_prompt: "photo, realistic, 3d render, gradient, soft shading, airbrush, texture, noise, blurry, sketch, monochrome, grayscale, text, watermark, signature"
      structure_image: experiments/samples/blank_white.png
      controlnet_strength: 0.0

lineart_methods:
  ip045_luma:
    prompt: &color_prompt "children's picture book illustration, flat colors, thick clean black outlines, simple shapes, plain white background"
    params: &ip045 {ipadapter_weight: 0.45, ipadapter_end_at: 0.5}
    extract: &luma {method: luma, threshold: 90}
  ip045_xdog:
    prompt: *color_prompt
    params: *ip045
    extract: &xdog {method: xdog, sigma: 0.8, k: 1.6, p: 20.0, eps: 0.02, phi: 10.0}
  # = C0 的 ip_weak
  ip055_luma:
    prompt: *color_prompt
    params: &ip055 {ipadapter_weight: 0.55, ipadapter_end_at: 0.6}
    extract: *luma
  ip055_xdog:
    prompt: *color_prompt
    params: *ip055
    extract: *xdog
  ip065_luma:
    prompt: *color_prompt
    params: &ip065 {ipadapter_weight: 0.65, ipadapter_end_at: 0.7}
    extract: *luma
  ip065_xdog:
    prompt: *color_prompt
    params: *ip065
    extract: *xdog

scenes:
  park:
    prompt: "playing on a swing in a sunny park with trees"
  kitchen:
    prompt: "baking cookies in a cozy kitchen"
  bedroom:
    prompt: "reading a picture book on her bed at night, a small lamp, dark blue night sky in the window"
