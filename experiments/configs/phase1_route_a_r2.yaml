# Phase 1 Route A 第二輪：IP-Adapter 強度與參考圖形式
# 第一輪紀錄：experiments/results/phase1_first_20261019_141057/NOTES.md
# 場景、seed、prompt、後處理與第一輪相同，只改 lineart_methods 的變體。sketch_guided 本輪不跑（需要合理的結構圖）。

name: phase1_route_a_r2

character:
  name: momo
  description: "a cute small bunny girl with long upright blue bunny ears, blue bob hair, big round eyes, blue and white striped overalls, blue shoes"
  reference_image: experiments/samples/character_ref.png

seeds: [101, 202, 303]

postprocess:
  target_width: 2480
  target_height: 3508
  line_width_px: 11
  min_fragment_area: 64
  close_kernel: 7

routes:
  A:
    workflow: route_a_sdxl_ipadapter_cn
    params:
      character_image: "{character_image}"
      prompt: "{character}, {scene}, {lineart}"
      structure_image: experiments/samples/blank_white.png
      controlnet_strength: 0.0

lineart_methods:
  # 對照組：等同第一輪 prompt_only
  baseline:
    prompt: &lineart_prompt "black and white coloring book page for children, clean bold uniform outlines, pure white background, no shading, no gray, no color"
    params:
      ipadapter_weight: 0.8
      ipadapter_end_at: 1.0
  # IP-Adapter 減弱、只作用前 60%
  ip_weak:
    prompt: *lineart_prompt
    params:
      ipadapter_weight: 0.55
      ipadapter_end_at: 0.6
  # 同 ip_weak，加強負向提示詞
  ip_weak_neg:
    prompt: *lineart_prompt
    params:
      ipadapter_weight: 0.55
      ipadapter_end_at: 0.6
      negative_prompt: "color, colored, colorful, blue, pink, red, filled color, colored hair, colored clothes, flat color, color fill, gray fill, shading, gradient, shadow, hatching, texture, photo, realistic, text, watermark, signature, blurry"
  # 參考圖改用線稿版，避免把顏色帶進來
  ref_lineart:
    prompt: *lineart_prompt
    params:
      character_image: experiments/samples/character_ref_lineart.png
      ipadapter_weight: 0.55
      ipadapter_end_at: 0.6

scenes:
  park:
    prompt: "playing on a swing in a sunny park with trees"
  kitchen:
    prompt: "baking cookies in a cozy kitchen"
