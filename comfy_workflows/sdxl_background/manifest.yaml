schema_version: 1
name: sdxl_background
display_name: "SDXL Base 背景生成（無角色）"
route: C
status: draft
description: >
  SDXL Base 1.0 生成不含角色的背景彩圖；可選 ControlNet Union（scribble 模式）吃草圖構圖。
  沒有草圖時傳全白圖並把 controlnet_strength 設 0。不使用 IP-Adapter。
workflow_file: workflow_api.json
notes: >
  由 route_a_sdxl_ipadapter_cn 移除 IP-Adapter 四個節點而來；節點類別與輸入已用 ComfyUI 0.36.0 的 /object_info 驗證。

parameters:
  prompt:
    type: string
    required: true
    max_length: 2000
    description: 正向提示詞
    targets: [{title: POSITIVE, input: text}]
  negative_prompt:
    type: string
    max_length: 2000
    default: "text, watermark, signature, blurry, people, person, character, animal"
    targets: [{title: NEGATIVE, input: text}]
  structure_image:
    type: image
    required: true
    description: 結構圖（白底黑線）；不使用時傳全白圖並把 controlnet_strength 設 0
    targets: [{title: STRUCTURE_IMAGE, input: image}]
  controlnet_strength:
    type: float
    min: 0.0
    max: 1.0
    default: 0.0
    targets: [{title: APPLY_CONTROLNET, input: strength}]
  controlnet_end_percent:
    type: float
    min: 0.0
    max: 1.0
    default: 0.5
    targets: [{title: APPLY_CONTROLNET, input: end_percent}]
  controlnet_type:
    type: enum
    choices: ["canny/lineart/anime_lineart/mlsd", "hed/pidi/scribble/ted", "openpose", "depth", "auto"]
    default: "hed/pidi/scribble/ted"
    targets: [{title: UNION_TYPE, input: type}]
  width:
    type: int
    min: 512
    max: 1536
    default: 832
    targets: [{title: LATENT, input: width}]
  height:
    type: int
    min: 512
    max: 1536
    default: 1216
    targets: [{title: LATENT, input: height}]
  seed:
    type: int
    min: 0
    max: 4294967295
    required: true
    targets: [{title: SAMPLER, input: seed}]
  steps:
    type: int
    min: 10
    max: 60
    default: 30
    targets: [{title: SAMPLER, input: steps}]
  cfg:
    type: float
    min: 1.0
    max: 12.0
    default: 6.0
    targets: [{title: SAMPLER, input: cfg}]
  sampler_name:
    type: enum
    choices: [dpmpp_2m, dpmpp_2m_sde, euler, euler_ancestral]
    default: dpmpp_2m
    targets: [{title: SAMPLER, input: sampler_name}]
  scheduler:
    type: enum
    choices: [karras, normal, simple, sgm_uniform]
    default: karras
    targets: [{title: SAMPLER, input: scheduler}]

outputs:
  - title: OUTPUT
    kind: image

models:
  - id: sdxl_base
    filename: sd_xl_base_1.0.safetensors
    folder: checkpoints
    source: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
    size_gb: 6.94
    loader: {title: CKPT, input: ckpt_name}
  - id: controlnet_union_promax
    filename: controlnet-union-sdxl-1.0-promax.safetensors
    folder: controlnet
    source: https://huggingface.co/xinsir/controlnet-union-sdxl-1.0/blob/main/diffusion_pytorch_model_promax.safetensors
    source_file: diffusion_pytorch_model_promax.safetensors
    size_gb: 2.51
    loader: {title: CONTROLNET, input: control_net_name}
    note: 下載後改名為 controlnet-union-sdxl-1.0-promax.safetensors
