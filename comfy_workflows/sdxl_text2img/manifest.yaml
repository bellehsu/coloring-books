schema_version: 1
name: sdxl_text2img
display_name: "SDXL Base 文字生圖（角色建立）"
route: A
status: draft
description: >
  SDXL Base 1.0 純文字生圖，用於建立角色參考圖（不含 IP-Adapter 與 ControlNet）。
workflow_file: workflow_api.json
notes: >
  節點類別與輸入欄位沿用 route_a_sdxl_ipadapter_cn（已用 ComfyUI 0.36.0 的 /object_info 驗證）。

parameters:
  prompt:
    type: string
    required: true
    max_length: 2000
    description: 正向提示詞
    targets: [{title: POSITIVE, input: text}]
  negative_prompt:
    type: string
    max_length: 2000
    default: "text, watermark, signature, blurry"
    targets: [{title: NEGATIVE, input: text}]
  width:
    type: int
    min: 512
    max: 1536
    default: 832
    targets: [{title: LATENT, input: width}]
  height:
    type: int
    min: 512
    max: 1536
    default: 1216
    targets: [{title: LATENT, input: height}]
  seed:
    type: int
    min: 0
    max: 4294967295
    required: true
    targets: [{title: SAMPLER, input: seed}]
  steps:
    type: int
    min: 10
    max: 60
    default: 30
    targets: [{title: SAMPLER, input: steps}]
  cfg:
    type: float
    min: 1.0
    max: 12.0
    default: 6.0
    targets: [{title: SAMPLER, input: cfg}]
  sampler_name:
    type: enum
    choices: [dpmpp_2m, dpmpp_2m_sde, euler, euler_ancestral]
    default: dpmpp_2m
    targets: [{title: SAMPLER, input: sampler_name}]
  scheduler:
    type: enum
    choices: [karras, normal, simple, sgm_uniform]
    default: karras
    targets: [{title: SAMPLER, input: scheduler}]

outputs:
  - title: OUTPUT
    kind: image

models:
  - id: sdxl_base
    filename: sd_xl_base_1.0.safetensors
    folder: checkpoints
    source: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
    size_gb: 6.94
    loader: {title: CKPT, input: ckpt_name}
