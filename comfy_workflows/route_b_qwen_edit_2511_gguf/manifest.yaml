schema_version: 1
name: route_b_qwen_edit_2511_gguf
display_name: "Route B：Qwen-Image-Edit-2511 Q4_K_M GGUF + Lightning 4-step"
route: B
status: draft
description: >
  Qwen-Image-Edit-2511（Q4_K_M GGUF）以 image1 = 角色參考圖、image2 = 結構圖做多圖編輯，
  搭配 Lightning 4-step LoRA（steps 4、cfg 1）。
workflow_file: workflow_api.json
notes: |
  草稿：workflow_api.json 由使用者從 ComfyUI 內建範本 image_qwen_image_edit_2511 修改後
  以「Export (API)」匯出。匯出前請在 ComfyUI 中完成以下修改，並把節點 title 設成下列名稱
  （右鍵節點 → Title；title 必須唯一，manifest 依 title 定位節點）：

    1. 「Load Diffusion Model」(UNETLoader) 換成「Unet Loader (GGUF)」(UnetLoaderGGUF)，
       選 qwen-image-edit-2511-Q4_K_M.gguf                                 → title: UNET
    2. LoraLoaderModelOnly 選 Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16 → title: LIGHTNING_LORA
    3. 刪除 Switch (Model/CFG/Steps)、PrimitiveInt/PrimitiveFloat/PrimitiveBoolean，
       直接把 LoRA 輸出接到後續 model 鏈，KSampler 的 steps=4、cfg=1 填成常數
       （API 匯出時 steps/cfg 若是連線就無法當參數覆寫）                   → KSampler title: SAMPLER
    4. 角色參考圖的 Load Image                                              → title: CHARACTER_REF
       結構圖的 Load Image（接到 image2）                                   → title: STRUCTURE_IMAGE
    5. 正向 TextEncodeQwenImageEditPlus                                     → title: POSITIVE
       負向 TextEncodeQwenImageEditPlus                                     → title: NEGATIVE
    6. 把 KSampler 的 latent_image 改接「EmptySD3LatentImage」（取代 VAEEncode 的輸出），
       讓輸出尺寸不受參考圖比例影響                                         → title: LATENT
    7. SaveImage                                                            → title: OUTPUT
    8. CLIPLoader（qwen_2.5_vl_7b_fp8_scaled, type qwen_image）             → title: TEXT_ENCODER
       VAELoader（qwen_image_vae）                                          → title: VAE

  可以保留 subgraph；API 匯出會攤平成 "170:149" 這類 id，manifest 只看 title 不受影響。
  匯出後執行 scripts/preflight.py，會檢查上述 title、輸入欄位、節點與模型是否齊全。

parameters:
  prompt:
    type: string
    required: true
    max_length: 2000
    description: 編輯指令，例如「Redraw the character in image 1 as a black-and-white coloring page ...」
    targets: [{title: POSITIVE, input: prompt}]
  negative_prompt:
    type: string
    max_length: 2000
    default: ""
    description: cfg = 1 時不起作用
    targets: [{title: NEGATIVE, input: prompt}]
  character_image:
    type: image
    required: true
    targets: [{title: CHARACTER_REF, input: image}]
  structure_image:
    type: image
    required: true
    description: 結構圖（白底黑線）。不需要結構時傳全白圖，並在 prompt 中只引用 image 1
    targets: [{title: STRUCTURE_IMAGE, input: image}]
  lora_strength:
    type: float
    min: 0.0
    max: 1.5
    default: 1.0
    targets: [{title: LIGHTNING_LORA, input: strength_model}]
  width:
    type: int
    min: 512
    max: 1664
    default: 864
    description: 16 的倍數；預設 864×1216 約 1MP、接近 A4 比例
    targets: [{title: LATENT, input: width}]
  height:
    type: int
    min: 512
    max: 1664
    default: 1216
    targets: [{title: LATENT, input: height}]
  seed:
    type: int
    min: 0
    max: 4294967295
    required: true
    targets: [{title: SAMPLER, input: seed}]
  steps:
    type: int
    min: 2
    max: 50
    default: 4
    description: Lightning LoRA 為 4；拿掉 LoRA 時約 40
    targets: [{title: SAMPLER, input: steps}]
  cfg:
    type: float
    min: 1.0
    max: 8.0
    default: 1.0
    targets: [{title: SAMPLER, input: cfg}]
  sampler_name:
    type: enum
    choices: [euler, euler_ancestral, dpmpp_2m]
    default: euler
    targets: [{title: SAMPLER, input: sampler_name}]
  scheduler:
    type: enum
    choices: [simple, normal, beta, sgm_uniform]
    default: simple
    targets: [{title: SAMPLER, input: scheduler}]

outputs:
  - title: OUTPUT
    kind: image

models:
  - id: qwen_edit_2511_q4km
    filename: qwen-image-edit-2511-Q4_K_M.gguf
    folder: unet
    comfy_folder: unet_gguf
    source: https://huggingface.co/unsloth/Qwen-Image-Edit-2511-GGUF/blob/main/qwen-image-edit-2511-Q4_K_M.gguf
    size_gb: 13.24
    loader: {title: UNET, input: unet_name}
  - id: qwen_text_encoder
    filename: qwen_2.5_vl_7b_fp8_scaled.safetensors
    folder: text_encoders
    source: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/blob/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    loader: {title: TEXT_ENCODER, input: clip_name}
  - id: qwen_vae
    filename: qwen_image_vae.safetensors
    folder: vae
    source: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/blob/main/split_files/vae/qwen_image_vae.safetensors
    loader: {title: VAE, input: vae_name}
  - id: lightning_lora_2511
    filename: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    folder: loras
    source: https://huggingface.co/lightx2v/Qwen-Image-Edit-2511-Lightning/blob/main/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    loader: {title: LIGHTNING_LORA, input: lora_name}

custom_nodes:
  - name: ComfyUI-GGUF
    repo: https://github.com/city96/ComfyUI-GGUF
    provides: [UnetLoaderGGUF, UnetLoaderGGUFAdvanced, CLIPLoaderGGUF]
    note: 需要 pip 套件 gguf>=0.13.0（裝在 ComfyUI 的 Python 環境）；以 6ea2651（2026-01-12）驗證
