schema_version: 1
name: qwen_edit_pose_cutout
display_name: "Qwen 精準角色動作＋自動去背"
route: C
status: draft
description: >
  Qwen-Image-Edit-2511（Q4_K_M GGUF）+ Lightning 4-step LoRA，以角色參考圖（image1）編輯出新動作（白底），
  再用內建 BiRefNet 去背。輸出兩張圖：OUTPUT（角色彩圖）與 MASK（去背遮罩，白＝角色）。
  NEGATIVE 為固定空字串（cfg = 1 時不起作用），不開放為參數。
workflow_file: workflow_api.json
notes: >
  節點與輸入欄位已用 ComfyUI 0.36.0 的 /object_info 驗證。
  固定值：euler / simple、denoise 1.0、ModelSamplingAuraFlow shift 3.1、CFGNorm 1.0。
  實驗紀錄：experiments/results/phase5_pose_consistency_20261110_0739。

parameters:
  prompt:
    type: string
    required: true
    max_length: 2000
    description: 編輯指令（以 image 1 的角色做新動作）
    targets: [{title: POSITIVE, input: prompt}]
  character_image:
    type: image
    required: true
    description: 角色參考圖（已上傳到 ComfyUI 的名稱）
    targets: [{title: CHARACTER_REF, input: image}]
  lora_strength:
    type: float
    min: 0.0
    max: 1.5
    default: 1.0
    targets: [{title: LIGHTNING_LORA, input: strength_model}]
  width:
    type: int
    min: 512
    max: 1664
    default: 832
    description: 16 的倍數
    targets: [{title: LATENT, input: width}]
  height:
    type: int
    min: 512
    max: 1664
    default: 1216
    targets: [{title: LATENT, input: height}]
  seed:
    type: int
    min: 0
    max: 4294967295
    required: true
    targets: [{title: SAMPLER, input: seed}]
  steps:
    type: int
    min: 2
    max: 50
    default: 4
    description: Lightning LoRA 為 4
    targets: [{title: SAMPLER, input: steps}]
  cfg:
    type: float
    min: 1.0
    max: 8.0
    default: 1.0
    targets: [{title: SAMPLER, input: cfg}]

outputs:
  - title: OUTPUT
    kind: image
  - title: MASK
    kind: image

models:
  - id: qwen_edit_2511_q4km
    filename: qwen-image-edit-2511-Q4_K_M.gguf
    folder: unet
    comfy_folder: unet_gguf
    source: https://huggingface.co/unsloth/Qwen-Image-Edit-2511-GGUF/blob/main/qwen-image-edit-2511-Q4_K_M.gguf
    size_gb: 13.24
    loader: {title: UNET, input: unet_name}
  - id: qwen_text_encoder
    filename: qwen_2.5_vl_7b_fp8_scaled.safetensors
    folder: text_encoders
    source: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/blob/main/split_files/text_encoders/qwen_2.5_vl_7b_fp8_scaled.safetensors
    loader: {title: TEXT_ENCODER, input: clip_name}
  - id: qwen_vae
    filename: qwen_image_vae.safetensors
    folder: vae
    source: https://huggingface.co/Comfy-Org/Qwen-Image_ComfyUI/blob/main/split_files/vae/qwen_image_vae.safetensors
    loader: {title: VAE, input: vae_name}
  - id: lightning_lora_2511
    filename: Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    folder: loras
    source: https://huggingface.co/lightx2v/Qwen-Image-Edit-2511-Lightning/blob/main/Qwen-Image-Edit-2511-Lightning-4steps-V1.0-bf16.safetensors
    loader: {title: LIGHTNING_LORA, input: lora_name}
  - id: birefnet
    filename: birefnet.safetensors
    folder: background_removal
    source: https://huggingface.co/Comfy-Org/BiRefNet/resolve/main/background_removal/birefnet.safetensors
    size_gb: 0.44
    loader: {title: BG_REMOVAL_MODEL, input: bg_removal_name}

custom_nodes:
  - name: ComfyUI-GGUF
    repo: https://github.com/city96/ComfyUI-GGUF
    provides: [UnetLoaderGGUF]
    note: 需要 pip 套件 gguf>=0.13.0（裝在 ComfyUI 的 Python 環境）；以 6ea2651（2026-01-12）驗證
