schema_version: 1
name: sdxl_pose_cutout
display_name: "SDXL 角色動作＋自動去背"
route: C
status: draft
description: >
  SDXL Base 1.0 + IP-Adapter Plus 以角色參考圖生成新動作（白底），再用內建 BiRefNet 去背。
  輸出兩張圖：OUTPUT（角色彩圖）與 MASK（去背遮罩，白＝角色）。不使用 ControlNet。
workflow_file: workflow_api.json
notes: >
  新節點 LoadBackgroundRemovalModel／RemoveBackground／MaskToImage 已用 ComfyUI 0.36.0 的 /object_info 驗證。

parameters:
  prompt:
    type: string
    required: true
    max_length: 2000
    description: 正向提示詞
    targets: [{title: POSITIVE, input: text}]
  negative_prompt:
    type: string
    max_length: 2000
    default: "text, watermark, signature, blurry"
    targets: [{title: NEGATIVE, input: text}]
  character_image:
    type: image
    required: true
    description: 角色參考圖（已上傳到 ComfyUI 的名稱）
    targets: [{title: CHARACTER_REF, input: image}]
  ipadapter_weight:
    type: float
    min: 0.0
    max: 2.0
    default: 0.55
    targets: [{title: IPADAPTER, input: weight}]
  ipadapter_end_at:
    type: float
    min: 0.0
    max: 1.0
    default: 0.6
    targets: [{title: IPADAPTER, input: end_at}]
  ipadapter_weight_type:
    type: enum
    choices: [linear, ease in-out, style transfer, composition, strong style transfer, style and composition]
    default: linear
    targets: [{title: IPADAPTER, input: weight_type}]
  width:
    type: int
    min: 512
    max: 1536
    default: 832
    targets: [{title: LATENT, input: width}]
  height:
    type: int
    min: 512
    max: 1536
    default: 1216
    targets: [{title: LATENT, input: height}]
  seed:
    type: int
    min: 0
    max: 4294967295
    required: true
    targets: [{title: SAMPLER, input: seed}]
  steps:
    type: int
    min: 10
    max: 60
    default: 30
    targets: [{title: SAMPLER, input: steps}]
  cfg:
    type: float
    min: 1.0
    max: 12.0
    default: 6.0
    targets: [{title: SAMPLER, input: cfg}]
  sampler_name:
    type: enum
    choices: [dpmpp_2m, dpmpp_2m_sde, euler, euler_ancestral]
    default: dpmpp_2m
    targets: [{title: SAMPLER, input: sampler_name}]
  scheduler:
    type: enum
    choices: [karras, normal, simple, sgm_uniform]
    default: karras
    targets: [{title: SAMPLER, input: scheduler}]

outputs:
  - title: OUTPUT
    kind: image
  - title: MASK
    kind: image

models:
  - id: sdxl_base
    filename: sd_xl_base_1.0.safetensors
    folder: checkpoints
    source: https://huggingface.co/stabilityai/stable-diffusion-xl-base-1.0
    size_gb: 6.94
    loader: {title: CKPT, input: ckpt_name}
  - id: ipadapter_plus_sdxl
    filename: ip-adapter-plus_sdxl_vit-h.safetensors
    folder: ipadapter
    source: https://huggingface.co/h94/IP-Adapter/blob/main/sdxl_models/ip-adapter-plus_sdxl_vit-h.safetensors
    size_gb: 0.85
    loader: {title: IPADAPTER_MODEL, input: ipadapter_file}
  - id: clip_vision_vit_h
    filename: CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors
    folder: clip_vision
    source: https://huggingface.co/h94/IP-Adapter/blob/main/models/image_encoder/model.safetensors
    source_file: models/image_encoder/model.safetensors
    size_gb: 2.53
    loader: {title: CLIP_VISION, input: clip_name}
    note: 下載後改名為 CLIP-ViT-H-14-laion2B-s32B-b79K.safetensors（IPAdapter_plus 慣用名稱）
  - id: birefnet
    filename: birefnet.safetensors
    folder: background_removal
    source: https://huggingface.co/ZhengPeng7/BiRefNet
    size_gb: 0.44
    loader: {title: BG_REMOVAL_MODEL, input: bg_removal_name}

custom_nodes:
  - name: ComfyUI_IPAdapter_plus
    repo: https://github.com/cubiq/ComfyUI_IPAdapter_plus
    provides: [IPAdapterModelLoader, IPAdapterAdvanced]
    note: 作者已停止開發（僅維護）；以 a0f451a（2025-04-14）驗證
