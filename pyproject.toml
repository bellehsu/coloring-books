[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coloring-books"
version = "0.1.0"
description = "AI 固定角色兒童著色繪本平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "scikit-image>=0.24",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "moto>=5.0"]

[tool.setuptools.package-dir]
app = "backend/app"
experiments = "experiments"

[tool.setuptools]
packages = ["app", "app.services", "experiments"]

[tool.setuptools.package-data]
app = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
